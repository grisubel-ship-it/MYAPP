workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 30
    instance_type: mac_mini_m2
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Install CocoaPods (se usi React Native)
        script: |
          if [ -d "ios" ]; then
            cd ios && pod install
          fi
      - name: Build React App
        script: |
          Verifica: il file viene aggiornato senza il comando npm run build





















