<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14A395"/>
      <stop offset="55%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#0A5651"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.28"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background full-bleed (Play Store aggiunge i corner radius) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!--
    Cuore Lucide viewBox 24x24: path da x=2..22 (w=20) y=3..21 (h=18)
    Scala 16 → 320x288. Centro geometrico → tx=(512-20*16)/2 - 2*16 = 64, ty=(512-18*16)/2 - 3*16 = 64
    Ma il baricentro visivo del cuore è ~55% dall'alto: sposto -18px per centrarlo otticamente.
  -->
  <g transform="translate(52 42) scale(17)" filter="url(#shadow)">
    <path
      d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"
      fill="#FFFFFF"
    />
  </g>
</svg>
